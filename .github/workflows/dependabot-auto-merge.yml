#
#   Dependabot Auto-Merge
#
# Enables GitHub auto-merge on Dependabot PRs. It only flips the
# auto-merge flag and does NOT bypass branch protection: GitHub merges
# once the `check` status required by the "CI gate" ruleset on `main`
# passes. That requirement is load-bearing -- with no required checks,
# `gh pr merge --auto` sees the PR as mergeable and merges it at once.
#
# `pull_request_target` is used so the workflow can read the
# `AUTOMERGE_TOKEN` Actions secret; Dependabot's own `pull_request` runs
# get no Actions secrets. Because no PR-controlled code is checked out
# or executed, this trigger is safe here. `GITHUB_TOKEN` is unused, so
# it gets no permissions.
#
# Auto-merge is enabled with a personal access token (`AUTOMERGE_TOKEN`)
# rather than the default `GITHUB_TOKEN`. GitHub suppresses workflow runs
# for events triggered by the `GITHUB_TOKEN` (the only exceptions are
# `workflow_dispatch` and `repository_dispatch`), so a merge attributed
# to it would never fire CI's `push` run on `main`. The PAT carries a
# distinct identity, so the merge's `push` event triggers CI normally.
# The PAT needs `contents: write`, `pull-requests: write`, and
# `workflows: write` on this repository (fine-grained, repo-scoped).
#
# See: https://docs.github.com/en/actions/security-for-github-actions/security-guides/automatic-token-authentication#using-the-github_token-in-a-workflow
#
# `gh pr merge --auto` can still exit non-zero in transient states
# (conflicts, ineligible base). We log those cases and exit successfully
# so they do not surface as red checks -- the next PR event
# (synchronize, labeled, ...) will retry. Persistent failures (missing
# token or token permissions, repo-level auto-merge disabled, missing
# `gh`) are surfaced as job failures so they get fixed instead of
# silently leaving auto-merge off forever.

name: Dependabot Auto-Merge

on:
  pull_request_target:
    branches: [main]
    types: [opened, reopened, synchronize, labeled, ready_for_review]

permissions: {}

jobs:
  auto-merge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.draft == false &&
      contains(github.event.pull_request.labels.*.name, 'dependencies')
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          # An unset secret leaves GH_TOKEN empty; gh's error for that
          # matches none of the persistent patterns below, so catch it here.
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::The AUTOMERGE_TOKEN secret is not set."
            exit 1
          fi
          set +e
          output=$(gh pr merge --auto --squash "$PR_URL" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            exit 0
          fi
          # Treat permission/config/tooling errors as persistent: if we
          # silently ignored these, auto-merge would never get enabled
          # and CI would stay green forever. Everything else (conflicts,
          # ineligible base) is transient and retried on the next PR event.
          if printf '%s' "$output" | grep -qiE 'resource not accessible|auto[- ]merge is not allowed|auto[- ]merge is not enabled|bad credentials|requires authentication|gh: command not found'; then
            echo "::error::Persistent failure enabling auto-merge on $PR_URL -- see log above."
            exit 1
          fi
          echo "::notice::Could not enable auto-merge on $PR_URL (likely transient: conflicts or ineligible base). The next PR event will retry."
