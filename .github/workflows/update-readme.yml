name: Update README

on:
  schedule:
    # Every 6 hours: the log shows relative labels ("today", "yesterday")
    # that would go stale on a daily schedule.
    - cron: "23 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Regenerate the dynamic sections
        run: |
          pip install .
          update-readme
        env:
          # An optional README_TOKEN (a PAT) lets the language bar include
          # private repositories; the default token only sees public ones.
          GITHUB_TOKEN: ${{ secrets.README_TOKEN != '' && secrets.README_TOKEN || github.token }}

      - name: Commit and push if changed
        run: |
          git add README.md assets/languages.svg assets/languages-recent.svg assets/languages-cache.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Refresh the dynamic sections"
            git push
          fi
