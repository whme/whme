name: Update README

on:
  schedule:
    # Berlin local time; GitHub tracks the CET/CEST switch for us. The updater
    # renders labels and timestamps in the same zone (--timezone below), so the
    # "today"/"yesterday" labels roll over at Berlin midnight. Running at 01:43
    # — safely after midnight — keeps a fresh "today" accurate for nearly the
    # whole day. The :43 minute keeps it off the top of the hour, where GitHub
    # Actions load peaks and scheduled runs are delayed most.
    - cron: "43 01 * * *"
      timezone: "Europe/Berlin"
    - cron: "17 15 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Push as a user on the "CI gate" bypass list; github-actions[bot] is not one and gets rejected.
          token: ${{ secrets.README_TOKEN != '' && secrets.README_TOKEN || github.token }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Regenerate the dynamic sections
        # Installed from the subdirectory but run at the repo root, where README.md lives.
        env:
          # Passed via env, not interpolated into the script, so the value can
          # never be read as shell; the CLI flags below reference it explicitly.
          OWNER: ${{ github.repository_owner }}
          # README_TOKEN must be a *classic* PAT with the `repo` and `read:org`
          # scopes, not a fine-grained one. The updater runs global, cross-owner
          # issue and commit searches (a contributor's activity spans repos it
          # does not own); a fine-grained PAT is scoped to a single owner and
          # GitHub answers such a search with 422 regardless of the scopes
          # granted. A classic PAT is not owner-restricted, so the search works,
          # and `repo`/`read:org` let the language bars include private (and
          # private org) repositories. When unset, the default github.token is
          # used: public search works, but no private repositories are seen.
          # The token stays in the environment (read by --github-token's envvar)
          # rather than on the command line, where a secret would leak into the
          # process list.
          GITHUB_TOKEN: ${{ secrets.README_TOKEN != '' && secrets.README_TOKEN || github.token }}
          # When set, unhandled errors are reported to Sentry so a failed
          # scheduled run raises a notification instead of going unnoticed. The
          # updater treats an unset DSN as a no-op, so forks work without it.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: github-actions
        run: |
          pip install ./readme_updater
          readme-updater \
            --github-username "$OWNER" \
            --other-owned-github-username whmade \
            --fork-of whmade/cssh-rs=whme/csshw \
            --timezone Europe/Berlin

      - name: Commit and push if changed
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          if [ -n "$SCHEDULE" ]; then
            read -r minute hour _ <<<"$SCHEDULE"
            sched_hm=$(printf '%02d:%02d' "$hour" "$minute")
            trigger="$sched_hm $(TZ=Europe/Berlin date '+%Z')"
            # Use the scheduled day, so a run slipping past midnight still records the day it was due.
            day=today
            if [ "$(TZ=Europe/Berlin date -d "$sched_hm" +%s)" -gt "$(date +%s)" ]; then
              day=yesterday
            fi
            run_date=$(TZ=Europe/Berlin date -d "$day $sched_hm" +%Y-%m-%d)
          else
            trigger=$(TZ=Europe/Berlin date '+%H:%M %Z')
            run_date=$(TZ=Europe/Berlin date '+%Y-%m-%d')
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "$run_date $trigger Refresh the dynamic sections"
          git push
